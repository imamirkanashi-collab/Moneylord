<style>
:root{--sky1:#fbd58a;--sky2:#f4a460;--sky3:#e9805a;--panel:rgba(252,241,212,.8);--panel2:rgba(238,218,170,.55);--ink:#2b1a0b;--gold:#a8701a;--gold2:#8a5a12;--red:#9a2f1f;--redbtn:#9a2f1f;--green:#2f6b3a;--money:#24602f;--line:rgba(140,95,35,.55);--shadow:rgba(70,40,12,.28);--sheet:rgba(252,241,212,.92);--shop:rgba(246,232,196,.94);--card:rgba(255,250,235,.55);--card2:rgba(255,246,222,.85);--input:rgba(255,252,242,.88);--page:rgba(255,248,228,.5);--bg:#e9a86a;--m1:#d98b62;--m2:#b8634a;--m3:#8f4630;--cac:#4e2316;--cloud:#fff3d6;--sunv:1;--nightv:0;--hi:rgba(255,255,255,.28)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#050a1a;--sky2:#0e1f3d;--sky3:#1c3358;--panel:rgba(38,28,20,.82);--panel2:rgba(66,50,36,.62);--ink:#f4e9cd;--gold:#e6b655;--gold2:#f0c46a;--red:#ff9c85;--redbtn:#b8432f;--green:#3d8a52;--money:#8be39a;--line:rgba(230,182,85,.42);--shadow:rgba(0,0,0,.55);--sheet:rgba(32,24,17,.94);--shop:rgba(38,29,21,.96);--card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.14);--input:rgba(255,255,255,.1);--page:rgba(255,255,255,.05);--bg:#0a1226;--m1:#2c3a52;--m2:#222d42;--m3:#151a28;--cac:#0a0f1a;--cloud:#5a6b8c;--sunv:0;--nightv:1;--hi:rgba(255,255,255,.1);color-scheme:dark}}
:root[data-theme="dark"]{--sky1:#050a1a;--sky2:#0e1f3d;--sky3:#1c3358;--panel:rgba(38,28,20,.82);--panel2:rgba(66,50,36,.62);--ink:#f4e9cd;--gold:#e6b655;--gold2:#f0c46a;--red:#ff9c85;--redbtn:#b8432f;--green:#3d8a52;--money:#8be39a;--line:rgba(230,182,85,.42);--shadow:rgba(0,0,0,.55);--sheet:rgba(32,24,17,.94);--shop:rgba(38,29,21,.96);--card:rgba(255,255,255,.07);--card2:rgba(255,255,255,.14);--input:rgba(255,255,255,.1);--page:rgba(255,255,255,.05);--bg:#0a1226;--m1:#2c3a52;--m2:#222d42;--m3:#151a28;--cac:#0a0f1a;--cloud:#5a6b8c;--sunv:0;--nightv:1;--hi:rgba(255,255,255,.1);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%}
@supports (height:100dvh){html,body{height:100dvh}}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;margin:0;color:var(--ink);font-family:"Special Elite",Georgia,serif;background:var(--bg);user-select:none;-webkit-user-select:none;overflow:hidden}
body.fa{font-family:Vazirmatn,Tahoma,sans-serif}
.fa *{letter-spacing:0!important}
.fa .up b,.fa #earn,.fa .pop,.fa .mult button,.fa .sheet h2,.fa .done,.fa .evt{font-family:"Aref Ruqaa",Vazirmatn,serif!important}
.fa .dv,.fa .rst,.fa #earn small,.fa .logo small{font-family:Vazirmatn,Tahoma,sans-serif!important}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,transparent 62%,rgba(60,25,5,.2))}
.scene{shape-rendering:geometricPrecision;position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.high .cl{animation:cl 70s linear infinite alternate}
@keyframes cl{to{transform:translateX(40px)}}
.pn,.gear,.wallet,.honor,.up,.sheet{background:var(--panel);background-image:linear-gradient(180deg,var(--hi),rgba(255,255,255,0) 55%);border:1.5px solid var(--line);box-shadow:0 3px 10px var(--shadow),inset 0 0 0 1px rgba(255,255,255,.35)}
.app{height:100%;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(6px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;position:relative;z-index:1;min-height:0}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex:none}
.hl{min-width:0}
.logo{font-family:Rye,Georgia,serif;font-size:clamp(1.2rem,5.8vw,1.55rem);line-height:1;color:#fff1c8;text-shadow:0 2px 0 #7a3b1c,0 3px 10px rgba(60,30,10,.45);white-space:nowrap}
.logo small{display:block;font-family:"Special Elite",Georgia,serif;font-size:clamp(.48rem,2.2vw,.62rem);letter-spacing:.14em;color:#fff1c8;opacity:.9;margin-top:3px;text-shadow:0 1px 3px rgba(60,30,10,.6)}
.row{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.gear{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:50%;color:var(--ink);cursor:pointer;padding:0}
.gear:active{transform:scale(.94)}
.gear svg{width:17px;height:17px}
.wallet{display:flex;align-items:center;gap:5px;border-radius:20px;padding:2px 10px 2px 5px;max-width:34vw}
.coinb{display:flex;align-items:center;gap:4px;border-radius:20px;padding:2px 9px 2px 4px;max-width:26vw;background:var(--panel);border:1.5px solid var(--line);box-shadow:0 3px 10px var(--shadow),inset 0 0 0 1px rgba(255,255,255,.35)}
.coinb svg{width:22px;height:22px;flex:none}
#kc{font-size:clamp(.82rem,3.6vw,1rem);font-weight:bold;color:var(--gold2);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr}
.shopfab{position:fixed;right:10px;top:calc(40% - 24px);z-index:3;width:48px;height:48px;display:grid;place-items:center;padding:0;border-radius:12px;cursor:pointer;background:var(--panel);border:1.5px solid var(--line);box-shadow:0 3px 10px var(--shadow),inset 0 0 0 1px rgba(255,255,255,.35);transition:transform .06s}
.shopfab:active{transform:scale(.93)}
.shopfab svg{width:34px;height:34px}
.racefab{top:calc(40% + 34px)}
.horsefab{top:calc(40% + 92px)}
.stablefab{top:calc(40% + 150px)}
.sheet input{-webkit-user-select:text;user-select:text}
.hq{width:100%;font:inherit;font-size:.82rem;padding:6px 8px;margin-top:8px;border:1.5px solid var(--line);border-radius:6px;background:var(--input);color:var(--ink)}
.rar{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.rar button,.srt button{font:inherit;font-size:.62rem;padding:3px 7px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--ink);cursor:pointer;white-space:nowrap}
.rar button{flex:1 1 auto}
.rar button.on{color:#fff6dc;border-color:#f1cf6a}
.rar .ca.on{background:#5a3d1a}.rar .c0.on{background:#8b7a58}.rar .c1.on{background:#2f6b3a}.rar .c2.on{background:#2a5d9a}.rar .c3.on{background:#7a3fa8;color:#fff6dc}.c4.on{background:#c4202a;color:#fff6dc}.rar .c4.on{background:#c4202a;color:#fff6dc}
.srt{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:6px}
.srt span{font-size:.62rem;margin-right:2px}
.srt button.on{background:var(--green);color:#fbefcf;border-color:#f1cf6a}
.hcount{font-size:.62rem;opacity:.75;text-align:center;unicode-bidi:plaintext}
.hlist{max-height:36vh;overflow-y:auto;-webkit-overflow-scrolling:touch}

.cd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:3px 0 2px;min-width:0;font:inherit;color:var(--ink);background:var(--panel2);border:1.5px solid var(--line);border-radius:8px;cursor:default;position:relative;touch-action:manipulation}
.cd .dn{font-size:.62rem;font-weight:bold;opacity:.9}
.cd svg{width:20px;height:20px;display:block}
.cd .dv2{font-size:.66rem;font-weight:bold;color:var(--money);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cd.h7 .dv2{color:var(--red)}
.cd.got{opacity:.55;background:var(--card)}
.cd.got::after{content:"✓";position:absolute;top:-1px;right:2px;font-size:.8rem;font-weight:bold;color:var(--green)}
.cd.rdy{cursor:pointer;border-color:#f1cf6a;background:linear-gradient(180deg,#ffe58a,#e9b43c);color:#3a2006}
.cd.rdy .dv2{color:#3a2006}

.cd.nxt{border-style:dashed;border-color:var(--gold2)}
.cd.lck{opacity:.85}
.calt{text-align:center;font-size:.72rem;font-weight:bold;margin-top:4px;unicode-bidi:plaintext}
.calt.rdy{color:var(--red)}
.grow{display:flex;align-items:center;gap:6px;margin:0 0 4px;flex:none}
.grow .goal{flex:1 1 auto;margin:0;min-width:0}
.nbb{flex:none;position:relative;width:40px;height:40px;display:grid;place-items:center;padding:0;border-radius:10px;cursor:pointer;background:var(--panel);border:1.5px solid var(--line);box-shadow:0 3px 8px var(--shadow);color:var(--ink)}
.nbb svg{width:28px;height:28px}
.nbb:active{transform:scale(.94)}
.nbb .bdg{position:absolute;top:-6px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--redbtn);color:#fff6dc;border:1.5px solid #f1cf6a;font-size:.66rem;font-weight:bold;line-height:15px;text-align:center;display:none}
.nbb.has .bdg{display:block}

/* ===== notebook ===== */
.nbpage{border:1.5px solid var(--line);border-radius:4px;padding:6px 8px;background:repeating-linear-gradient(0deg,rgba(60,100,170,.13) 0 1px,transparent 1px 28px),var(--page);box-shadow:inset 0 0 18px rgba(140,95,35,.25)}
.nbtop{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.78rem;font-weight:bold;margin-top:6px;unicode-bidi:plaintext}
.nbl{max-height:56vh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:4px}
.nbt{display:flex;align-items:center;gap:8px;padding:6px 6px;margin-top:6px;border:1px solid var(--line);border-radius:7px;background:var(--card)}
.nbt .te{font-size:1.5rem;width:34px;text-align:center;flex:none;line-height:1}
.nbt .tb{flex:1;min-width:0}
.nbt .tx{font-size:.84rem;font-weight:bold;line-height:1.35;unicode-bidi:plaintext}
.nbt .bar{height:8px;border-radius:5px;background:rgba(60,30,8,.22);overflow:hidden;margin-top:4px;direction:ltr}
.nbt .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#d9731a,#ffd34d)}
.nbt .pg{font-size:.68rem;opacity:1;margin-top:2px;unicode-bidi:plaintext}
.nbt .rw{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px}
.nbt .rv{font-size:.76rem;font-weight:bold;color:var(--money);direction:ltr;white-space:nowrap}
.nbt .cl{font:inherit;font-size:.72rem;font-weight:bold;padding:5px 9px;border-radius:7px;border:1.5px solid #f1cf6a;background:var(--green);color:#fbefcf;cursor:pointer;display:none;white-space:nowrap}
.nbt.ok{border-color:#f1cf6a;background:var(--card2)}
.nbt.ok .cl{display:block}
.nbt.ok .bar i{background:linear-gradient(90deg,#ffb020,#fff07a)}
.nbt .cl:active{transform:scale(.95)}
.nbt.h1:not(.ok){border-color:#c98a2b}
.nbt.dn{opacity:.6}.nbt.dn .cl{display:none!important}
.nbt.ach .pp{display:flex;gap:2px;margin-top:4px;direction:ltr}.nbt.ach .pp i{flex:1;height:5px;border-radius:2px;background:rgba(60,30,8,.22)}.nbt.ach .pp i.on{background:linear-gradient(90deg,#d9731a,#ffd34d)}
#nbtabs button{font-size:.76rem;padding:6px 4px}
.pfvt{text-align:center;font-size:.8rem;font-weight:bold;color:var(--gold2);margin-top:2px;unicode-bidi:plaintext}
.pftw{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;justify-content:center}
.pftw .tc{font:inherit;font-size:.7rem;padding:4px 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;unicode-bidi:plaintext}
.pftw .tc.on{background:var(--green);color:#fbefcf;border-color:#f1cf6a}
.nbt.h2:not(.ok){border-color:#b04bd6;box-shadow:0 0 0 1px #b04bd6 inset}
.nbt .rr{font:inherit;font-size:.68rem;padding:3px 7px;border-radius:7px;border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer;opacity:.85;white-space:nowrap}
.nbt .rr:disabled{opacity:.4;cursor:default}
.wkb{position:relative}
.wkb.vhas::before{content:"";position:absolute;top:2px;right:3px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff0a0,#d29a22 60%,#7a5410);border:1px solid #5a3c08;pointer-events:none}
.wkb.vfull::before{box-shadow:0 0 0 2px rgba(255,210,74,.7)}
.high .wkb.vfull::before{animation:vpulse 1s ease-in-out infinite}
@keyframes vpulse{50%{transform:scale(1.35)}}

/* animations: vault chest, flying coins, tasks */
.wki{position:relative}.wki .m{position:relative}
.wkb.nap .wki.one svg,.wki .m.nap svg{transform:rotate(12deg) translateY(2px);transform-origin:50% 92%;filter:saturate(.7)}
.wkb.nap .wki::after{content:"\1F4A4";position:absolute;top:-6px;right:-8px;font-size:.62rem;line-height:1;pointer-events:none}
.wkb.nap .wki.grid::after{content:none}
.wki .m.nap::after{content:"z";position:absolute;top:-3px;right:-1px;font-size:.5rem;font-weight:bold;color:#6b5a3a}
.high .wkb.nap .wki::after{animation:zz 2.4s ease-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,4px) scale(.7)}35%{opacity:1}100%{opacity:0;transform:translate(5px,-9px) scale(1.1)}}
.high .wkb.nap .wki.one svg{animation:napb 2.8s ease-in-out infinite}
@keyframes napb{0%,100%{transform:rotate(12deg) translateY(2px)}50%{transform:rotate(12deg) translateY(3.5px) scaleY(.96)}}
.wkav{position:relative}
.wkav.nap svg{transform:rotate(10deg) translateY(2px);filter:saturate(.7)}
.wkav.nap::after{content:"\1F4A4";position:absolute;top:1px;right:3px;font-size:.7rem;line-height:1}
.high .wkav.nap::after{animation:zz 2.4s ease-out infinite}
.vchest{--f:0;width:56px;height:49px;flex:none}.vchest.big{width:96px;height:84px}
.vchest>svg{width:100%;height:100%;display:block;overflow:visible}
.vchest .pile{transform:translateY(calc((1 - var(--f))*24px));transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.vchest .gauge{transform:scaleX(var(--f));transform-origin:15px 46px;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.vchest .lid{transform-origin:6px 30px;transition:transform .3s ease-out}
.vchest.open .lid{transform:rotate(-72deg)}
.vchest.full{filter:drop-shadow(0 0 5px rgba(255,210,74,.85))}

@keyframes vglow{50%{filter:drop-shadow(0 0 1px rgba(255,210,74,.2))}}
.wkvrow{display:flex;align-items:center;gap:10px;margin-top:6px}.wkvrow .wkvtx{flex:1;min-width:0}
.awrow{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:4px 0 6px}
.awwk svg{width:64px;height:64px;display:block}
.high .awwk svg{animation:wkw .45s ease-in-out infinite alternate;transform-origin:50% 92%}
.fcoin{position:fixed;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff0a0,#d29a22 60%,#7a5410);border:1px solid #5a3c08;pointer-events:none;z-index:30;will-change:transform,opacity}
@keyframes nbOut{from{max-height:90px;opacity:1;transform:none}to{max-height:0;opacity:0;transform:translateX(60px);margin-top:0;padding-top:0;padding-bottom:0;border-width:0}}
.nbt.out{animation:nbOut .28s ease-in forwards;overflow:hidden}
@keyframes nbIn{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.nbt.in{animation:nbIn .38s ease-out both}
.high .nbt.ok{position:relative;overflow:hidden}
.high .nbt.ok::after{content:"";position:absolute;top:0;bottom:0;left:0;width:45%;background:linear-gradient(100deg,transparent,rgba(255,240,170,.38),transparent);transform:translateX(-130%);animation:nbSh 2.4s ease-in-out infinite;pointer-events:none}
@keyframes nbSh{to{transform:translateX(280%)}}
.high .nbt.ok .cl{animation:nbPulse 1.1s ease-in-out infinite}
@keyframes nbPulse{50%{transform:scale(1.09);box-shadow:0 0 0 3px rgba(241,207,106,.4)}}

.hc.pk{border-color:#f1cf6a;background:var(--card2);box-shadow:0 0 0 2px #f1cf6a}
.odd{flex:none;font-weight:bold;font-size:.9rem;padding:5px 9px;border-radius:7px;border:1.5px solid #f1cf6a;background:var(--green);color:#fbefcf;direction:ltr;white-space:nowrap}
.btpay{text-align:center;font-size:.8rem;font-weight:bold;margin-top:6px;color:var(--money);unicode-bidi:plaintext;min-height:1.3em}
/* ===== player profile ===== */
.hl{display:flex;align-items:center;gap:8px}
.hl .logo{min-width:0}
.pfb{flex:none;width:40px;height:40px;padding:0;border-radius:50%;border:2.5px solid #f1cf6a;background:var(--panel);overflow:hidden;cursor:pointer;display:none;box-shadow:0 3px 8px var(--shadow)}
.pfb.on{display:block}
.pfb:active{transform:scale(.94)}
.pfb svg,.pfa svg,.pfg button svg{width:100%;height:100%;display:block}
@media (max-width:380px){.logo{font-size:clamp(1.05rem,5vw,1.3rem)}.pfb{width:34px;height:34px}}
#pfm{z-index:20}
.pfsub{text-align:center;font-size:.8rem;line-height:1.45;margin:2px 0 4px;unicode-bidi:plaintext}
#pfm .hq{margin-top:4px}
.pfg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:6px;padding:3px}
.pfg button{aspect-ratio:1/1;padding:0;border:2px solid var(--line);border-radius:50%;overflow:hidden;background:var(--panel2);cursor:pointer}
.pfg button:active{transform:scale(.94)}
.pfg button.sel{border-color:#2a1a0c;box-shadow:0 0 0 3px #f1cf6a,0 0 0 5px #2f6b3a;transform:scale(1.05)}
.pfa{width:104px;height:104px;border-radius:50%;overflow:hidden;border:3px solid #f1cf6a;margin:4px auto 0;box-shadow:0 3px 10px var(--shadow),0 0 0 3px var(--line)}
.pfcard{margin-top:8px;padding:12px 12px 8px;border:1.5px solid var(--line);border-radius:6px;background:repeating-linear-gradient(0deg,rgba(168,112,26,.06) 0 3px,transparent 3px 6px),var(--page);box-shadow:inset 0 0 18px rgba(140,95,35,.25)}
.pfcard .hdn{margin-top:8px;font-size:1.15rem;word-break:break-word}
.pfrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.84rem;padding:5px 0;border-bottom:1px dashed var(--line);unicode-bidi:plaintext}
.pfrow:last-child{border-bottom:0}
.pfrow b{direction:ltr;unicode-bidi:plaintext}
.fa #pfm label,.fa #pfm .hint,.fa #pfm .pfrow{direction:rtl}
/* ===== task icon pop ===== */
.nbpop{position:absolute;right:-2px;top:48px;z-index:6;width:50px;height:50px;padding:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;background:var(--panel);border:2.5px solid #f1cf6a;box-shadow:0 4px 12px var(--shadow),0 0 0 3px rgba(241,207,106,.35);animation:nbout .55s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:85% -10%;transition:opacity .3s,transform .3s}
.nbpop::before{content:"";position:absolute;right:16px;top:-9px;width:12px;height:12px;background:var(--panel);border-left:2.5px solid #f1cf6a;border-top:2.5px solid #f1cf6a;transform:rotate(45deg);border-radius:2px 0 0 0}
.nbpop>svg{position:relative;width:30px;height:30px;display:block}
.nbpop .ck{position:absolute;right:-5px;bottom:-4px;width:21px;height:21px;border-radius:50%;background:var(--green);border:2px solid #f1cf6a;display:grid;place-items:center}
.nbpop .ck svg{width:13px;height:13px;display:block}
.nbpop.gain{display:flex;align-items:center;gap:6px;width:auto;height:42px;padding:0 13px 0 8px;border-radius:22px;white-space:nowrap}
.nbpop.gain>svg{width:28px;height:28px}
.nbpop.gain b{font-size:.98rem;color:var(--money);direction:ltr;font-variant-numeric:tabular-nums}
.nbpop.gain::before{right:20px}
.nbpop.out{opacity:0;transform:translateY(-14px) scale(.6)}
@keyframes nbout{0%{opacity:0;transform:translateY(-44px) scale(.15)}55%{opacity:1;transform:translateY(7px) scale(1.14)}78%{transform:translateY(-2px) scale(.96)}100%{opacity:1;transform:none}}
/* ===== get money + gift code ===== */
.wallet{padding-right:4px;max-width:calc(34vw + 26px)}
#money{min-width:0}
#gdtm{position:absolute;top:-9px;left:50%;transform:translateX(-50%);z-index:2;white-space:nowrap;direction:ltr;font-size:.58rem;font-weight:bold;line-height:1.35;padding:0 6px;border-radius:8px;background:rgba(43,26,11,.94);color:#fbefcf;border:1px solid #e2b73f;font-variant-numeric:tabular-nums;pointer-events:none;box-shadow:0 2px 4px rgba(0,0,0,.3)}
#gdtm:empty{display:none}
#gdtm.now{border-color:#e2573f;background:rgba(62,20,14,.96)}
.wplus{flex:none;width:22px;height:22px;border-radius:50%;padding:0;display:grid;place-items:center;border:1.5px solid #f1cf6a;background:var(--green);color:#fbefcf;cursor:pointer;margin-inline-start:2px}
.wplus svg{width:12px;height:12px;display:block}
.wplus:active{transform:scale(.9)}
#bym .bkc{margin-top:10px}
#gccode{margin-top:6px;direction:ltr;text-align:center;letter-spacing:.08em;text-transform:none}
#gcmsg{text-align:center;min-height:1.5em;font-weight:bold;margin-top:6px}
#gcmsg.ok{color:var(--green)}#gcmsg.no{color:var(--red)}

/* level / xp / skills */
.lvttl{flex:none;text-align:center;font-size:.64rem;line-height:1.2;font-weight:bold;letter-spacing:.06em;color:var(--gold2);margin:-1px 0 3px;unicode-bidi:plaintext;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fa .lvttl{font-family:Vazirmatn,Tahoma,sans-serif;letter-spacing:0}
.lvrow{display:flex;align-items:center;gap:6px;margin:0 0 4px;flex:none}
.lvchip{flex:none;min-width:48px;text-align:center;font-size:.68rem;font-weight:bold;padding:3px 7px;border-radius:8px;background:var(--panel2);border:1.5px solid var(--line);color:var(--gold2);white-space:nowrap;unicode-bidi:plaintext}
.lvbar{position:relative;flex:1 1 auto;min-width:0;height:22px;border-radius:8px;overflow:hidden;background:var(--panel);border:1.5px solid var(--line);direction:ltr}
.lvbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#4f9a5a,#b6e36a);opacity:.8;transition:width .3s}
.lvbar span{position:relative;display:block;text-align:center;font-size:.62rem;line-height:19px;font-weight:bold;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.lvbtn{flex:none;position:relative;width:36px;height:34px;display:grid;place-items:center;padding:0;border-radius:10px;cursor:pointer;background:var(--panel);border:1.5px solid var(--line);box-shadow:0 3px 8px var(--shadow);color:var(--ink);font-size:1.2rem;line-height:1}
.lvbtn:active{transform:scale(.94)}
.prb[hidden]{display:none}.prb .bdg{display:none}.prb.has .bdg{display:block}
.prb.rdy{border-color:#f1cf6a;animation:prpulse 1.6s ease-in-out infinite}
@keyframes prpulse{50%{box-shadow:0 0 12px 3px rgba(241,207,106,.85)}}
.prbuy{font:inherit;font-size:.68rem;padding:5px 8px;border:1.5px solid #f1cf6a;border-radius:7px;background:var(--green);color:#fbefcf;cursor:pointer;white-space:nowrap;direction:ltr;flex:none}
.prbuy:disabled{opacity:.5;cursor:not-allowed}.prbuy:active:not(:disabled){transform:scale(.96)}
.prl{flex:1;min-width:0;unicode-bidi:plaintext}.prl small{display:block;font-size:.64rem;opacity:.85;margin-top:1px}
.lvbtn .bdg{position:absolute;top:-6px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--redbtn);color:#fff6dc;border:1.5px solid #f1cf6a;font-size:.66rem;font-weight:bold;line-height:15px;text-align:center;display:none}
.lvbtn.has .bdg{display:block}
.honor{margin:6px 0 4px}
.tsec{display:flex;flex-direction:column;gap:3px;margin:0 0 4px;padding:4px 7px 3px;border-radius:10px;flex:none}
.tsec .lvrow,.tsec .grow{margin:0}
.tsec .lvbar,.tsec .goal:not(.rdy){box-shadow:none;background:var(--panel2);background-image:none}
.tsec .nbb{width:36px;height:34px;box-shadow:0 2px 6px var(--shadow)}
.tsec .nbb svg{width:24px;height:24px}
.tsec .lvttl{margin:0;line-height:1.1}

.lvh{font-size:.74rem;font-weight:bold;margin-top:10px;color:var(--gold2);unicode-bidi:plaintext;text-align:center}
.skc{display:flex;align-items:center;gap:8px;padding:6px;margin-top:6px;border:1px solid var(--line);border-radius:7px;background:var(--card)}
.skc .ic{font-size:1.5rem;width:34px;text-align:center;flex:none;line-height:1}
.skc .tb{flex:1;min-width:0}
.skc .tx{font-size:.82rem;font-weight:bold;line-height:1.3;unicode-bidi:plaintext}
.skc .ds{font-size:.68rem;line-height:1.35;margin-top:1px;unicode-bidi:plaintext}
.skc .nx{font-size:.62rem;opacity:.75;line-height:1.3;unicode-bidi:plaintext}
.skc .pp{display:flex;gap:2px;margin-top:4px;direction:ltr}
.skc .pp i{flex:1;height:5px;border-radius:2px;background:rgba(60,30,8,.22)}
.skc .pp i.on{background:linear-gradient(90deg,#d9731a,#ffd34d)}
.skc .bu{flex:none;font:inherit;font-size:.7rem;font-weight:bold;padding:5px 9px;border-radius:7px;border:1.5px solid #f1cf6a;background:var(--green);color:#fbefcf;cursor:pointer;white-space:nowrap}
.skc .bu:disabled{opacity:.45;cursor:default}
.skc .bu:active:not(:disabled){transform:scale(.95)}
.unr{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.76rem;padding:4px 6px;margin-top:4px;border:1px solid var(--line);border-radius:6px;background:var(--card);unicode-bidi:plaintext}
.unr.on{opacity:.8}
.unr b{direction:ltr;font-size:.7rem;color:var(--gold2)}
[data-lv]{filter:grayscale(1);opacity:.55}
[data-lv]::after{content:attr(data-lv);position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);font-size:.55rem;font-weight:bold;line-height:1.3;white-space:nowrap;background:var(--redbtn);color:#fff6dc;border:1px solid #f1cf6a;border-radius:6px;padding:0 4px;pointer-events:none}
.up[data-lv]::after{top:3px;right:4px;bottom:auto;left:auto;transform:none}
.mult button[data-lv]{position:relative}
.mult button[data-lv]::after{content:"\1F512";position:static;transform:none;background:none;border:0;padding:0;margin-inline-start:2px;font-size:.6rem}
.igl svg{width:24px;height:24px;color:#c13584}
.igl:active{transform:scale(.94)}
.sethd{position:sticky;top:-12px;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:6px;margin:-12px -14px 6px;padding:10px 14px 6px;background:var(--sheet);border-bottom:1px solid var(--line)}
.sethd h2{margin:0!important;flex:1 1 auto;min-width:0}
.sethdsp{flex:none;width:74px}
.igl{flex:none;width:74px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink);text-decoration:none;direction:ltr}
.igl span{font-size:.5rem;line-height:1.2;text-align:center;font-weight:bold;opacity:.9;white-space:normal}
.fa .igl span{font-family:Vazirmatn,Tahoma,sans-serif;font-size:.56rem;direction:rtl}
/* Persian: clear digits (Aref Ruqaa / Special Elite digits are hard to read) */
.fa .pop,.fa .mult button,.fa .up,.fa .up .lv,.fa .up .c,.fa .up .d,.fa .wallet,.fa #money,.fa .rate,.fa .gfb span,.fa .goal span,.fa .hlab,.fa .evtm,.fa #earn small,.fa .wkbal,.fa .nbt,.fa .skc,.fa .lvchip,.fa .lvbar span,.fa .unr,.fa .toast,.fa .hdn,.fa .rcres,.fa .rcres b,.fa .bkc,.fa .hc,.fa .wkstats,.fa .shs,.fa .hnote,.fa .hint{font-family:Vazirmatn,Tahoma,sans-serif!important}

/* fix: locked upgrade cards showed two overlapping badges; lock chips covered button labels */
.up[data-lv] .lv{display:none}

/* v33 UI */
#fabt{top:calc(40% - 24px);color:var(--ink);transition:transform .2s}

#fabm{position:fixed;right:10px;top:calc(40% + 34px);z-index:4;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:16px;background:var(--panel);border:1.5px solid var(--line);box-shadow:0 8px 24px var(--shadow);opacity:0;transform:translateY(-8px) scale(.96);transform-origin:top right;pointer-events:none;transition:opacity .18s,transform .18s}
#fabm.open{opacity:1;transform:none;pointer-events:auto}
#fabm .shopfab{position:relative;top:auto;right:auto;width:auto;min-width:140px;height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:10px;box-shadow:none;background:var(--panel2);color:var(--ink);font:inherit;font-weight:bold;font-size:.9rem;white-space:nowrap}

#earn{position:fixed;left:calc(50% - 70px);top:calc(47% - 70px);width:140px;height:140px;max-width:none;flex:none;padding:0;border-radius:50%;border-width:3px;z-index:2;box-shadow:0 7px 0 rgba(30,70,35,.7),0 12px 28px var(--shadow),inset 0 0 22px rgba(255,255,255,.25)}

#earn>span{display:none}
.stage{justify-content:space-between}
header,.wallet{box-shadow:0 2px 10px var(--shadow)}
.up{border-radius:12px}

/* v34 bill button */
#earn,#earn.fv{left:calc(50% - 100px);top:calc(47% - 62px);width:200px;height:125px;border:0;border-radius:6px;background:none!important;box-shadow:none!important;overflow:visible}

#earn:active{transform:scale(.95)}
#earn.fv svg{filter:drop-shadow(0 0 16px rgba(255,210,80,.95))}
.high #earn::after{display:none}
#earninfo{position:fixed;left:50%;top:calc(47% + 70px);transform:translateX(-50%);z-index:2;text-align:center;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:bold}

#wgl{order:2;font-size:.85rem;color:#ff8f7e;text-shadow:0 1px 3px rgba(60,30,10,.8);direction:ltr;min-height:1em}
.pop{z-index:3}

/* v35 */
.coin{display:none!important}
#earn,.high #earn{animation:none!important}
#earn svg{animation:bf 3.2s ease-in-out infinite;transition:transform .15s cubic-bezier(.3,1.8,.5,1)}

@keyframes bp{0%{scale:1}35%{scale:1.14}100%{scale:1}}

#earn.tp svg{animation:bf 3.2s ease-in-out infinite,bp .32s cubic-bezier(.2,1.6,.4,1)}
#earn::before{content:"";position:absolute;inset:14px 4px;border:3px solid #ffe08a;border-radius:10px;opacity:0;pointer-events:none}
#earn.tp::before{animation:br .45s ease-out}
#earn:active svg{transform:translateY(4px) scale(.93) rotate(-2deg);filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
#earn.fv svg{animation:bf 1.4s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(255,200,60,1)) drop-shadow(0 0 6px rgba(255,240,160,.9))}
#earninfo{gap:3px}
#wgl{line-height:1.3}

/* v37: cheap glow pulses (opacity only, no box-shadow/filter animation) */

.high .gfb.fv::after,.high .goal.rdy::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 10px 3px rgba(255,225,100,.95);opacity:.15;animation:gfo .5s ease-in-out infinite alternate}

.lite .gfb::after,.lite .goal::after,.lite .cd::after,.lite .nbb::after,.lite .lvbtn::after,.lite .nbpop::after,.lite .wallet::after,.lite .vchest::before,.low .gfb::after,.low .goal::after,.low .cd::after,.low .nbb::after,.low .lvbtn::after,.low .nbpop::after,.low .wallet::after,.low .vchest::before{display:none!important}
